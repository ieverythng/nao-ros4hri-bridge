<svg xmlns="http://www.w3.org/2000/svg" width="9m" height="6m" viewBox="-4.5 -3 9 6">
  <title>semantic_kitchen_delivery</title>
  <desc>rqt_human_radar-compatible kitchen delivery fixture with kitchen objects, robot station, handoff area, and ALEX.</desc>
  <g id="walls">
    <rect id="delivery_floor" x="-4.1" y="-2.6" width="8.2" height="5.2" fill="#f7f8fb" stroke="#6b7280" stroke-width="0.05"/>
    <rect id="codex_kitchen" x="-3.7" y="-2.1" width="3.3" height="3.0" fill="#e8f3ee" stroke="#2f6b4f" stroke-width="0.04"/>
    <rect id="codex_kitchen_surface" x="-2.95" y="-1.15" width="1.9" height="0.9" fill="#d9c7a3" stroke="#8a6a36" stroke-width="0.04"/>
    <rect id="codex_robot_station" x="1.4" y="1.0" width="2.4" height="1.2" fill="#edf1fb" stroke="#315a9b" stroke-width="0.04"/>
    <rect id="codex_handoff_area" x="1.3" y="-2.2" width="2.4" height="1.6" fill="#fff4df" stroke="#9a6b22" stroke-width="0.04"/>
  </g>
  <g id="static_objects">
    <circle id="codex_kitchen_cup" class="Cup" cx="-2.55" cy="-1.35" r="0.2" fill="#ffffff" stroke="#3f3f46" stroke-width="0.03"/>
    <rect id="codex_kitchen_book" class="Book" x="-1.9" y="-1.42" width="0.46" height="0.34" fill="#63a16f" stroke="#22543d" stroke-width="0.03"/>
    <circle id="codex_recipient_person" class="Human" cx="2.5" cy="-1.4" r="0.32" fill="#f2b56b" stroke="#8a4b17" stroke-width="0.03"/>
    <rect id="nao_robot_pose" class="Robot" x="2.35" y="1.45" width="0.42" height="0.45" fill="#c8d3ff" stroke="#3d4d91" stroke-width="0.03"/>
  </g>
</svg>
