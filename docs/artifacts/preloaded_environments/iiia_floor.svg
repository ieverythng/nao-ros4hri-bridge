<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">IIIA floor preloaded environment</title>
  <desc id="desc">A larger semantic fixture with robot station, corridor, lab, kitchen, distributed objects, and ALEX.</desc>
  <style>
    .wall{fill:#f7f8fb;stroke:#4d5c68;stroke-width:3}
    .corridor{fill:#eef0f4;stroke:#6b7785;stroke-width:2}
    .lab{fill:#e8f3fb;stroke:#23618a;stroke-width:3}
    .kitchen{fill:#eef7ec;stroke:#3b753d;stroke-width:3}
    .station{fill:#f4efe4;stroke:#8a6d2f;stroke-width:3}
    .handoff{fill:#fff4df;stroke:#9a6b22;stroke-width:3}
    .table{fill:#d8c69f;stroke:#6c5630;stroke-width:3}
    .robot{fill:#7cc5d8;stroke:#1b6170;stroke-width:3}
    .person{fill:#efb35b;stroke:#8a5410;stroke-width:3}
    .cup{fill:#f2f2f2;stroke:#59636e;stroke-width:3}
    .book{fill:#4b76d4;stroke:#1d3d83;stroke-width:3}
    .phone{fill:#9aa4ad;stroke:#45515d;stroke-width:3}
    text{font-family:Arial,sans-serif;font-size:22px;fill:#20242b}
    .small{font-size:17px;fill:#47515c}
  </style>
  <rect class="wall" x="30" y="30" width="1140" height="700" rx="14"/>
  <rect class="station" x="70" y="265" width="245" height="190" rx="10"/>
  <text x="100" y="305">robot_station</text>
  <circle class="robot" cx="190" cy="375" r="34"/>
  <text class="small" x="150" y="430">myself / NAO</text>
  <rect class="corridor" x="345" y="265" width="210" height="190" rx="8"/>
  <text x="390" y="365">corridor</text>
  <rect class="lab" x="610" y="95" width="470" height="250" rx="12"/>
  <text x="650" y="135">lab</text>
  <rect class="table" x="730" y="185" width="230" height="90" rx="8"/>
  <text class="small" x="780" y="215">lab_table</text>
  <rect class="book" x="780" y="230" width="58" height="38" rx="4"/>
  <rect class="phone" x="870" y="235" width="72" height="25" rx="5"/>
  <text class="small" x="708" y="315">IIIA_BOOK blue, IIIA_PHONE silver</text>
  <rect class="kitchen" x="610" y="410" width="470" height="250" rx="12"/>
  <text x="650" y="450">kitchen</text>
  <rect class="table" x="730" y="505" width="230" height="90" rx="8"/>
  <text class="small" x="770" y="535">kitchen_table</text>
  <circle class="cup" cx="850" cy="565" r="28"/>
  <text class="small" x="760" y="625">IIIA_CUP white</text>
  <rect class="handoff" x="95" y="78" width="240" height="155" rx="10"/>
  <text x="145" y="112">handoff_area</text>
  <circle class="person" cx="215" cy="160" r="38"/>
  <text x="182" y="222">ALEX</text>
  <text class="small" x="124" y="250">ALEX oro:isIn handoff_area</text>
  <line x1="315" y1="360" x2="345" y2="360" stroke="#7b8794" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="555" y1="335" x2="610" y2="220" stroke="#7b8794" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="555" y1="385" x2="610" y2="535" stroke="#7b8794" stroke-width="4" stroke-dasharray="10 8"/>
  <text class="small" x="420" y="705">Fixture purpose: maximal location-scoped delivery, failure injection, and replan demonstrations.</text>
</svg>
