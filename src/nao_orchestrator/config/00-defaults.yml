/nao_orchestrator:
  ros__parameters:
    intent_topic: "/intents"
    enable_legacy_intent_bridge: false
    legacy_intent_topic: "/chatbot/intent"
    nao_say_action: "/nao/say"
    dispatch_speech_intents: false
    nao_say_wait_sec: 0.2
    replay_motion_action: "/skill/replay_motion"
    replay_motion_speed: 0.8
    replay_motion_wait_sec: 0.2
    replay_motion_result_timeout_sec: 20.0
    head_motion_action: "/skill/do_head_motion"
    head_motion_speed: 0.25
    head_motion_wait_sec: 0.2
    look_at_action: "/skill/look_at"
    look_at_wait_sec: 0.2
    posture_command_topic: "/chatbot/posture_command"
    posture_command_result_topic: "/chatbot/posture_command_result"
    posture_command_result_timeout_sec: 20.0
    fallback_to_posture_topic: true
    head_motion_joint_angles_topic: "/joint_angles"
    fallback_to_joint_angles_topic: true
    planner_feedback_topic: "/planner/execution_feedback"
    dedupe_window_sec: 0.8
    default_greeting: "Hello! Nice to meet you."
    scan_result_mode: "success"
    scan_action: "/skill/scan"
    scan_action_wait_sec: 0.2
    scan_action_result_timeout_sec: 20.0
    scan_report_after_success: true
    fake_skill_wait_sec: 0.2
    fake_skill_result_timeout_sec: 20.0
    fake_skill_navigate_to_action: "/skill/fake/navigate_to"
    fake_skill_find_object_action: "/skill/fake/find_object"
    fake_skill_wave_greet_action: "/skill/fake/wave_greet"
    fake_skill_inspect_area_action: "/skill/fake/inspect_area"
    fake_skill_walk_to_action: "/skill/fake/walk_to"
    report_result_action: "/skill/report_result"
    report_result_action_wait_sec: 0.2
    report_result_action_result_timeout_sec: 8.0

/scan_skill_server:
  ros__parameters:
    action_name: "/skill/scan"
    head_motion_action: "/skill/do_head_motion"
    head_motion_speed: 0.25
    head_motion_wait_sec: 1.0
    head_motion_result_timeout_sec: 6.0
    scan_result_mode: "success"
    scan_summary: ""
    scan_summary_topic: "/scene/summary"
    scan_people_topic: "/humans/persons/tracked"
    scan_people_max_age_sec: 2.0
    scan_min_sweeps: 1
    scan_max_sweeps: 2
    scan_sweep_yaw_rad: 0.45
    scan_sweep_pitch_rad: 0.0
    scan_sweep_settle_sec: 0.2
    scan_require_motion: true

/report_result_skill_server:
  ros__parameters:
    action_name: "/skill/report_result"
    say_action: "/skill/say"
    say_action_wait_sec: 0.2
    say_action_result_timeout_sec: 8.0
