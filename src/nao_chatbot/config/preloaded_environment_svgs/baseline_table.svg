<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="800cm" height="600cm" viewBox="0 0 8000 6000">
  <title>baseline_table</title>
  <desc>ROS4HRI interaction simulator environment for the baseline table fixture.</desc>
  <g inkscape:label="walls" transform="scale(10)">
    <rect id="baseline_floor" x="30" y="30" width="740" height="540" rx="18" fill="#f7f8fb" stroke="#4b5563" stroke-width="8"/>
    <rect id="robot_station_zone" x="75" y="345" width="180" height="145" rx="12" fill="#edf1fb" stroke="#315a9b" stroke-width="6"/>
    <rect id="baseline_table_surface" x="470" y="225" width="215" height="130" rx="10" fill="#d8c69f" stroke="#6c5630" stroke-width="6"/>
    <rect id="baseline_robot_station" x="145" y="385" width="54" height="68" rx="10" fill="#c8d3ff" stroke="#3d4d91" stroke-width="5"/>
  </g>
  <g inkscape:label="static_objects" transform="scale(10)">
