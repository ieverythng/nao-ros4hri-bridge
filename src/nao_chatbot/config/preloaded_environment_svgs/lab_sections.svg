<svg xmlns="http://www.w3.org/2000/svg" width="10m" height="7m" viewBox="-5 -3.5 10 7">
  <title>lab_sections</title>
  <desc>rqt_human_radar-compatible lab fixture with robot station, desk area, work table, handoff area, and ALEX.</desc>
  <g id="walls">
    <rect id="codex_lab_room" x="-4.6" y="-3.0" width="9.2" height="6.0" fill="#f7f8fb" stroke="#4d5c68" stroke-width="0.05"/>
    <rect id="codex_robot_station" x="-4.1" y="-2.2" width="1.9" height="1.4" fill="#edf1fb" stroke="#315a9b" stroke-width="0.04"/>
    <rect id="codex_desk_area" x="-1.4" y="-2.2" width="2.4" height="1.8" fill="#e7eff7" stroke="#255d83" stroke-width="0.04"/>
    <rect id="codex_work_table_area" x="1.8" y="-2.2" width="2.4" height="2.2" fill="#e7eff7" stroke="#255d83" stroke-width="0.04"/>
    <rect id="codex_handoff_area" x="-3.6" y="1.0" width="2.0" height="1.4" fill="#fff4df" stroke="#9a6b22" stroke-width="0.04"/>
    <rect id="codex_lab_desk" x="-0.9" y="-1.6" width="1.4" height="0.8" fill="#c9b18a" stroke="#6c5630" stroke-width="0.04"/>
    <rect id="codex_work_table" x="2.25" y="-1.55" width="1.45" height="0.95" fill="#d8c69f" stroke="#6c5630" stroke-width="0.04"/>
  </g>
  <g id="static_objects">
    <rect id="codex_lab_computer" class="Computer" x="-0.65" y="-1.42" width="0.45" height="0.32" fill="#333b45" stroke="#1f2937" stroke-width="0.03"/>
    <rect id="codex_lab_keyboard" class="Keyboard" x="-0.05" y="-1.15" width="0.45" height="0.18" fill="#f2f2f2" stroke="#4b5563" stroke-width="0.03"/>
    <circle id="codex_lab_cup" class="Cup" cx="2.55" cy="-1.08" r="0.18" fill="#cf4a43" stroke="#7d1f1a" stroke-width="0.03"/>
    <rect id="codex_lab_manual" class="Book" x="2.95" y="-1.28" width="0.42" height="0.3" fill="#4e9a55" stroke="#22543d" stroke-width="0.03"/>
    <rect id="codex_lab_phone" class="CellularTelephone" x="2.72" y="-0.82" width="0.5" height="0.18" fill="#9aa4ad" stroke="#45515d" stroke-width="0.03"/>
    <circle id="codex_alex_person" class="Human" cx="-2.6" cy="1.7" r="0.28" fill="#efb35b" stroke="#8a5410" stroke-width="0.03"/>
  </g>
</svg>
