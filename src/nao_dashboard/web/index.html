<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NAO Mission Hub</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="hub-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">NAO ROS4HRI</p>
          <h1>Mission Hub</h1>
          <p id="run-meta" class="run-meta">Waiting for runtime...</p>
        </div>
        <div class="status-stack">
          <span id="connection-pill" class="pill is-offline">offline</span>
          <span id="updated-at" class="updated-at">never</span>
        </div>
      </header>

      <section class="kpi-grid" id="kpi-grid"></section>

      <section class="grid-layout">
        <article class="panel panel-timeline">
          <div class="panel-head">
            <h2>Live Timeline</h2>
            <span id="timeline-count" class="panel-meta">0 events</span>
          </div>
          <div id="timeline" class="timeline-list"></div>
        </article>

        <article class="panel panel-health">
          <div class="panel-head">
            <h2>Action Health</h2>
            <span id="action-health-meta" class="panel-meta">0 online</span>
          </div>
          <div id="action-health" class="table-wrap"></div>
        </article>

        <article class="panel panel-ros">
          <div class="panel-head">
            <h2>ROS Graph Snapshot</h2>
            <span id="ros-meta" class="panel-meta">0 nodes</span>
          </div>
          <div id="ros-graph" class="table-wrap"></div>
        </article>

        <article class="panel panel-ab">
          <div class="panel-head">
            <h2>AB Registry</h2>
            <span id="ab-meta" class="panel-meta">0 objects</span>
          </div>
          <div id="ab-registry" class="table-wrap"></div>
        </article>
      </section>
    </main>

    <template id="timeline-item-template">
      <article class="timeline-item">
        <header>
          <span class="event-type"></span>
          <span class="channel"></span>
          <span class="timestamp"></span>
        </header>
        <p class="summary"></p>
      </article>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
