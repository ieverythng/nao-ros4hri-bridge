default:
  navigate_to:
    result_mode: success
    delay_sec: 1.0
  find_object:
    result_mode: found
    target_found: true
    delay_sec: 0.8
  perform_motion:
    result_mode: success
    delay_sec: 0.6
  wave_greet:
    result_mode: success
    dry_run: true
    delay_sec: 1.2
  inspect_area:
    result_mode: clear
    delay_sec: 0.9
  look_at:
    result_mode: success
    delay_sec: 0.5
  walk_to:
    result_mode: dry_run
    dry_run: true
    delay_sec: 0.7

scenarios:
  path_blocked:
    navigate_to:
      result_mode: path_blocked
  ambiguous_cup:
    find_object:
      result_mode: ambiguous
  social_wave_unavailable:
    wave_greet:
      result_mode: motion_unavailable
  motion_unavailable:
    perform_motion:
      result_mode: motion_unavailable
  motion_convergence_timeout:
    perform_motion:
      result_mode: convergence_timeout
  area_person_found:
    inspect_area:
      result_mode: person_found
  look_at_unavailable:
    look_at:
      result_mode: target_unavailable
  object_near_robot:
    find_object:
      result_mode: found
      frame_id: base_link
      position: {x: 0.7, y: 0.1, z: 0.6}
      distance_m: 0.93
  object_far_from_robot:
    find_object:
      result_mode: found
      frame_id: base_link
      position: {x: 3.8, y: 0.4, z: 0.6}
      distance_m: 3.87
  head_motion_strict: {}
